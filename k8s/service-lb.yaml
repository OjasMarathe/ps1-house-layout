apiVersion: v1
kind: Service
metadata:
  name: house-pipeline
  namespace: house-pipeline
spec:
  # LoadBalancer = GKE provisions a Google Cloud load balancer with a public IP.
  # (For the self-managed kubeadm path, use service.yaml — NodePort — instead.)
  type: LoadBalancer
  selector:
    app: house-pipeline
  ports:
    - port: 80
      targetPort: 8000
